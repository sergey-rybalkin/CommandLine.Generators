name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version_number:
        description: "Version number, e.g. 1.4.2"
        required: true
        type: string
      create_tag:
        description: "Create a new tag for the release"
        required: true
        type: boolean
        default: true
      prerelease:
        description: "Mark as prerelease"
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

env:
  DEFAULT_BRANCH: main

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release -p:Version=${{ inputs.version_number }} -p:UpdateVersionFromGit=False

      - name: Pack NuGet package
        run: dotnet pack ./src/CommandLine.Generators/CommandLine.Generators.csproj --configuration Release -p:Version=${{ inputs.version_number }} -p:UpdateVersionFromGit=False

      # Get a short-lived NuGet API key
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: sergey-rybalkin

      - name: Publish NuGet package
        run: dotnet nuget push ./src/artifacts/package/release/*.nupkg -k ${{ steps.login.outputs.NUGET_API_KEY }} -s
          https://api.nuget.org/v3/index.json --skip-duplicate

  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.DEFAULT_BRANCH }}

      - name: Validate tag format
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version_number }}"

          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || {
            echo "Invalid version format: $VERSION"
            exit 1
          }

      - name: Fail if tag already exists
        shell: bash
        if: ${{ inputs.create_tag }}
        run: |
          set -euo pipefail
          TAG="v${{ inputs.version_number }}"
          git fetch --tags --force
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG"
            exit 1
          fi

      - name: Create annotated tag at current default branch HEAD
        shell: bash
        if: ${{ inputs.create_tag }}
        run: |
          set -euo pipefail
          ACTOR="${{ github.triggering_actor || github.actor }}"
          TAG="v${{ inputs.version_number }}"

          git config user.name "$ACTOR"
          git config user.email "$ACTOR@users.noreply.github.com"

          git tag -a "$TAG" -m "Version $TAG"
          git push origin "$TAG"

      - name: Build release name
        id: release_name
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version_number}}"
          echo "value=Version $VERSION" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ inputs.prerelease }}
          tag_name: v${{ inputs.version_number }}
          generate_release_notes: true
          name: ${{ steps.release_name.outputs.value }}
